name: Verify Pro plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check version, PHP syntax, release guards, and ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test publishing safeguards
        run: python3 -m unittest discover -s .github/tests -v

      - name: Validate plugin and build installable ZIP
        id: package
        run: python3 .github/scripts/plugin_package.py --output-dir "$RUNNER_TEMP/wpiko-pro-package"

      - name: Save verified ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpiko-chatbot-pro-verified-package
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7
