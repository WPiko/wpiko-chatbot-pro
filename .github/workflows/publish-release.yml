name: Publish Pro Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test only (leave unchecked to publish the plugin version)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-wpiko-chatbot-pro
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish Pro
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Select main when running this workflow."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Test publishing safeguards
        run: python3 -m unittest discover -s .github/tests -v

      - name: Validate and publish, or test without publishing
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Ed25519 private key (PEM). Customer sites only install updates signed with it.
          WPIKO_RELEASE_SIGNING_KEY: ${{ secrets.WPIKO_RELEASE_SIGNING_KEY }}
        run: |
          options=(--output-dir "$RUNNER_TEMP/wpiko-pro-package")
          if [ "$DRY_RUN" = true ]; then
            options+=(--dry-run)
          fi
          python3 .github/scripts/publish-release.py "${options[@]}"

      - name: Save verified ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpiko-chatbot-pro-package-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sig_path }}
          if-no-files-found: error
          retention-days: 7

      # Optional: ask Keymaster on wpiko.com to fetch the new release now instead of
      # within the hour. The ping carries no file; Keymaster downloads and checks it.
      - name: Tell Keymaster about the release
        if: ${{ !inputs.dry_run }}
        env:
          KEYMASTER_PING_URL: ${{ secrets.KEYMASTER_PING_URL }}
          KEYMASTER_PING_SECRET: ${{ secrets.KEYMASTER_PING_SECRET }}
        run: |
          if [ -z "$KEYMASTER_PING_URL" ] || [ -z "$KEYMASTER_PING_SECRET" ]; then
            echo "Keymaster ping secrets not set; Keymaster checks GitHub every hour."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --data-urlencode "secret=$KEYMASTER_PING_SECRET" "$KEYMASTER_PING_URL" \
            || echo "::warning::Keymaster could not be reached; it will find the release on its hourly check."
